<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineScope</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit';
            background: #080810;
            color: white;
            margin: 0;
        }

        .hero {
            text-align: center;
            padding: 40px;
        }

        .search-wrap {
            max-width: 400px;
            margin: auto;
            position: relative;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            border: none;
            outline: none;
        }

        button {
            position: absolute;
            right: 5px;
            top: 50%;
            transform: translateY(-50%);
            background: #e040fb;
            border: none;
            color: white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
        }

        .container {
            padding: 20px;
            max-width: 1100px;
            margin: auto;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: .3s;
        }

        .movie-card:hover {
            transform: translateY(-5px);
        }

        .movie-card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .movie-info {
            padding: 10px;
        }

        .loading {
            text-align: center;
            padding: 30px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: #000000cc;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: #111;
            padding: 20px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
        }

        .modal img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .close-btn {
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            background: #e040fb;
            border: none;
            color: white;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="hero">
        <h1>CineScope</h1>
        <div class="search-wrap">
            <input id="searchInput" placeholder="Search movies...">
            <button onclick="searchMovies()">🔍</button>
        </div>
    </div>

    <div class="container">
        <div id="movieGrid" class="movie-grid"></div>
        <div id="loading" class="loading" style="display:none">Loading...</div>
    </div>

    <div id="modalOverlay" class="modal-overlay" onclick="closeModal(event)">
        <div id="modalBox" class="modal" onclick="event.stopPropagation()"></div>
    </div>

    <script>
        const API = "f38454bb";
        let movies = [];

        function renderMovies(list) {
            const grid = document.getElementById("movieGrid");

            if (!list.length) {
                grid.innerHTML = "<p>No movies found</p>";
                return;
            }

            grid.innerHTML = list.map((m, i) => `
<div class="movie-card" onclick="openModal(${i})">
<img src="${m.Poster !== "N/A" ? m.Poster : "https://via.placeholder.com/300x450"}">
<div class="movie-info">
<div><b>${m.Title}</b></div>
<div>${m.Year}</div>
<div>⭐ ${m.imdbRating || "-"}</div>
</div>
</div>
`).join("");
        }

        async function searchMovies() {
            const q = document.getElementById("searchInput").value.trim();
            if (!q) return;

            document.getElementById("loading").style.display = "block";
            document.getElementById("movieGrid").innerHTML = "";

            try {
                const res = await fetch(`https://www.omdbapi.com/?s=${q}&apikey=${API}`);
                const data = await res.json();

                if (data.Response === "True") {
                    const full = await Promise.all(
                        data.Search.slice(0, 10).map(m =>
                            fetch(`https://www.omdbapi.com/?i=${m.imdbID}&apikey=${API}`).then(r => r.json())
                        )
                    );
                    movies = full;
                    renderMovies(full);
                } else {
                    renderMovies([]);
                }
            } catch (e) {
                alert("Error fetching data");
            }

            document.getElementById("loading").style.display = "none";
        }

        function openModal(i) {
            const m = movies[i];

            document.getElementById("modalBox").innerHTML = `
<img src="${m.Poster !== "N/A" ? m.Poster : "https://via.placeholder.com/300x450"}">
<h2>${m.Title}</h2>
<p><b>Year:</b> ${m.Year}</p>
<p><b>Genre:</b> ${m.Genre}</p>
<p><b>Rating:</b> ⭐ ${m.imdbRating}</p>
<p>${m.Plot}</p>
<p><b>Director:</b> ${m.Director}</p>
<p><b>Actors:</b> ${m.Actors}</p>
<button class="close-btn" onclick="closeModal()">Close</button>
`;

            document.getElementById("modalOverlay").classList.add("open");
        }

        function closeModal(e) {
            if (!e || e.target.id === "modalOverlay") {
                document.getElementById("modalOverlay").classList.remove("open");
            }
        }

        document.getElementById("searchInput").addEventListener("keydown", e => {
            if (e.key === "Enter") searchMovies();
        });
    </script>

</body>

</html>
